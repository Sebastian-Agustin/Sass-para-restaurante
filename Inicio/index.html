<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi tienda - Panel de productos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado">
        <h1>Panel de productos</h1>
        <nav class="navegacion">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h2>Agregar producto</h2>
            <form id="form-producto" class="formulario">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ej: Remera negra" required>

                <label for="precio">Precio</label>
                <input type="number" id="precio" placeholder="Ej: 15000" min="0" required>

                <button type="submit" class="btn btn-principal">Guardar producto</button>
            </form>
        </section>

        <section class="tarjeta">
            <h2>Productos</h2>
            <ul id="lista-productos" class="lista-productos"></ul>
        </section>
    </main>

    <script src="js/productos.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
